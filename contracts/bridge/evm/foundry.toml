# Unleashed bridge L1 contracts (Foundry). Aztec L1 interfaces are remapped to the
# installed @aztec/l1-artifacts sources — no aztec-contracts submodule.
# The static @aztec/ remap below assumes the HOISTED node_modules layout. Under
# the isolated linker, run `bun scripts/gen-remappings.ts` from
# packages/bridge-core first: it writes remappings.txt (gitignored), which
# Foundry gives priority over these TOML remappings, with @aztec/ pointing at
# node_modules/ here, a link to bridge-core's declared dependency, so no machine
# path enters the metadata solc hashes into the bytecode. CI and the sandbox's
# forge step run it.
[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
allow_paths = ["../../../node_modules"]
solc = "0.8.28"
via_ir = true
# Read: test/BridgeMessageV1.t.sol and PortalVectors read the shared wire-format vectors.
# Write: ProcessorPortalInvariant appends each run's counts for scripts/check-invariant.sh.
fs_permissions = [
  { access = "read", path = "../../../packages/bridge-spec/vectors" },
  { access = "write", path = "./out/invariant-stats" },
]

remappings = [
  "@oz/=lib/openzeppelin-contracts/contracts/",
  "@aztec/=../../../node_modules/@aztec-foundation/l1-artifacts/l1-contracts/src/",
  "@aztec-blob-lib/=../../../node_modules/@aztec-foundation/l1-artifacts/l1-contracts/src/core/libraries/rollup/",
  "@test/=test/",
  "forge-std/=lib/forge-std/src/",
]

# Pinned, not inherited: leaving these at Foundry's defaults means a toolchain upgrade can
# silently change how much of the input space the fuzz and invariant suites actually cover,
# with no diff to review.
[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 100
# Kept permissive deliberately: handler actions bound their own inputs and wrap the
# expected-revert cases in try/catch, but `sweep` on an empty balance and other benign
# no-ops still revert, and failing the campaign on those would only add noise.
fail_on_revert = false

# The deep run, scripts/nightly.sh. Every key not set here comes from the default profile.
[profile.nightly.fuzz]
runs = 5000

[profile.nightly.invariant]
depth = 500

# test/PortalFork.t.sol, run only by packages/sepolia-fork against the anvil it owns. The cases read that
# runner's fixture and nothing else; Forge's RPC cache stays off so a block height reused by a fresh fork
# never serves an earlier run's state.
[profile.fork]
ffi = false
no_storage_caching = true
fs_permissions = [{ access = "read", path = "./out/fork" }]
