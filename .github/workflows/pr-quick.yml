name: Quality

on:
  workflow_dispatch:
  pull_request:
    # NO `branches:` filter, deliberately. That key filters on the PR's BASE, so a stacked arc
    # targeting its parent branch would get no CI at all rather than red CI.
    # `ready_for_review` so a draft marked ready without a new push still reports the required
    # `quality-status`; otherwise it waits as "Expected" forever.
    # No `labeled`/`unlabeled`: nothing here reads labels, so a label event would only cancel the
    # in-flight run (leaving a cancelled `quality-status` behind) or redo it.
    # Gap: retargeting a PR fires `edited`, which is not listed because every title or body edit
    # fires it too (and would cancel the in-flight run). After a retarget with no new push, close
    # and reopen the PR so a real pull_request run judges it against its new base; a
    # `workflow_dispatch` run skips the PR-only checks, so it never stands in for one.
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: pr-quick-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      needs-kit-build: ${{ steps.compute.outputs.needs-kit-build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: paths-filter needs the merge-base with the comparison branch; a
          # shallow clone falls back to a `fetch --deepen` loop that races on long branches.
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          # Positive-only, no `!` negations (dorny's `some`-quantifier footgun). The kit whole; the
          # bridge-core sources, the workspace libraries they import and the sandbox harness; the
          # hub, registry and token artifacts bridge-core bundles from contracts/. Pinned by
          # scripts/ci-cd/behavior-gating.test.ts.
          filters: |
            kit:
              - 'packages/e2e-kit/**'
              - 'packages/bridge-core/src/**'
              - 'packages/bridge-core/scripts/**'
              - 'packages/bridge-core/package.json'
              - 'packages/bridge-spec/src/**'
              - 'packages/bridge-spec/package.json'
              - 'packages/pool-client/src/**'
              - 'packages/pool-client/package.json'
              - 'contracts/bridge/aztec/token_bridge_hub/target/**'
              - 'contracts/bridge/aztec/asp_registry/target/**'
              - 'contracts/bridge/aztec/labelled_token/target/**'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
            root-config:
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'biome.json'
              - 'tsconfig.json'
              - 'vitest.base.ts'
              - '.commitlintrc.json'
              - '.githooks/**'
              - 'patches/**'
      - name: Compute downstream flags
        id: compute
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          KIT: ${{ steps.filter.outputs.kit }}
          WORKFLOWS: ${{ steps.filter.outputs.workflows }}
          ROOT: ${{ steps.filter.outputs.root-config }}
        run: |
          if [ "$DISPATCH" = "true" ] || [ "$KIT" = "true" ] || [ "$WORKFLOWS" = "true" ] || [ "$ROOT" = "true" ]; then
            echo "needs-kit-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs-kit-build=false" >> "$GITHUB_OUTPUT"
          fi

  commitlint:
    name: Commitlint
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # Only the PR's own commits: a sync of main into an integration branch carries main's history,
      # which that PR cannot change. commit-messages.yml lints them on a retarget, and the squash subject.
      - name: Lint PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-cd/commitlint-own.sh "$HEAD_SHA" "$BASE_SHA" origin/main

  lint-and-typecheck:
    name: Lint + Typecheck
    needs: changes
    uses: ./.github/workflows/_lint-and-typecheck.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}

  unit-tests:
    name: Unit tests
    needs: changes
    uses: ./.github/workflows/_unit-tests.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}

  build-e2e-kit:
    name: Build E2E kit
    needs: changes
    if: needs.changes.outputs.needs-kit-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # Build-only: the placeholder handle and origin stand in for a live sandbox, whose real values
      # the runner bakes in on every local run.
      - name: Build the test wallet
        env:
          PP_SANDBOX_ARTIFACTS: fixtures/build-artifacts
          PP_APP_ORIGIN: http://127.0.0.1:4173
        run: bun run --cwd packages/e2e-kit build:test-wallet

  status:
    name: quality-status
    if: always()
    needs: [changes, commitlint, lint-and-typecheck, unit-tests, build-e2e-kit]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate results
        env:
          EVENT: ${{ github.event_name }}
          NEEDS_KIT_BUILD: ${{ needs.changes.outputs.needs-kit-build }}
          CHANGES: ${{ needs.changes.result }}
          COMMITLINT: ${{ needs.commitlint.result }}
          LINT: ${{ needs.lint-and-typecheck.result }}
          UNIT: ${{ needs.unit-tests.result }}
          BUILD_KIT: ${{ needs.build-e2e-kit.result }}
        run: |
          # Exact states, not a failure denylist: a job that never ran must not read as green.
          fail=0
          expect() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1 must be '$3', got '$2'"
              fail=1
            fi
          }
          expect "Detect changes" "$CHANGES" success
          expect "Lint + Typecheck" "$LINT" success
          expect "Unit tests" "$UNIT" success
          if [ "$EVENT" = "pull_request" ]; then
            expect Commitlint "$COMMITLINT" success
          else
            expect Commitlint "$COMMITLINT" skipped
          fi
          case "$NEEDS_KIT_BUILD" in
            true) expect "Build E2E kit" "$BUILD_KIT" success ;;
            false) expect "Build E2E kit" "$BUILD_KIT" skipped ;;
            *) echo "::error::needs-kit-build is not true/false: '$NEEDS_KIT_BUILD'"; fail=1 ;;
          esac
          exit "$fail"
