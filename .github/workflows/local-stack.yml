name: Local stack

# PR gate for `bun run demo`: one anvil carrying the Aztec local network and the pool.
#
# NO `branches:` filter, deliberately — see the long note in pr-quick.yml. That key filters
# on the PR's BASE, so a stacked arc targeting its parent branch would get zero CI.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: local-stack-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      stack: ${{ steps.override.outputs.full || steps.filter.outputs.stack }}
      suites: ${{ steps.suites.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: List the integration suites
        id: suites
        # One matrix leg per file on disk, so a new suite cannot go unrun. The names reach a shell, so
        # anything but [a-z0-9-] fails here; files are counted without newlines, so a name holding one
        # cannot split into valid lines.
        run: |
          dir=packages/local-stack/test/integration
          all=$(find "$dir" -maxdepth 1 -type f -name '*.integration.test.ts' -printf x | wc -c)
          list=$(find "$dir" -maxdepth 1 -type f -regextype posix-extended -regex '.*/[a-z0-9-]+\.integration\.test\.ts' \
            -printf '%f\n' | sed 's/\.integration\.test\.ts$//' | sort)
          if [ "$all" -eq 0 ] || [ "$(grep -c . <<<"$list")" -ne "$all" ]; then echo "unexpected suite file name"; exit 1; fi
          echo "list=$(jq -Rnc '[inputs]' <<<"$list")" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          # Positive-only. The stack boots bridge-core's harness and pp-env's pool, so both packages
          # move it whole; its bridge step deploys the contracts and imports bridge-core's libraries.
          # Pinned by scripts/ci-cd/behavior-gating.test.ts.
          filters: |
            stack:
              - 'packages/local-stack/**'
              - 'packages/bridge-core/**'
              - 'packages/pp-env/**'
              - 'contracts/bridge/**'
              - 'packages/bridge-spec/src/**'
              - 'packages/bridge-spec/package.json'
              - 'packages/pool-client/src/**'
              - 'packages/pool-client/package.json'
              - 'packages/pool-client/test/support/**'
              - 'packages/asp-bot/src/**'
              - 'packages/asp-bot/package.json'
              - 'packages/label-paths/src/**'
              - 'packages/label-paths/package.json'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'vitest.base.ts'
              - 'patches/**'
              - '.github/workflows/local-stack.yml'
              - '.github/actions/setup-aztec/**'
              - '.github/actions/setup-bun/**'
              - '.github/actions/ppv2-fetch/**'
              - '.github/actions/bridge-evm-build/**'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "full=true" >> "$GITHUB_OUTPUT"

  stack:
    # One leg per suite file keeps each job inside the pull-request time budget.
    name: stack (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    # The suite step carries the tight bound; this ceiling only catches a stuck setup.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
    env:
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - uses: ./.github/actions/setup-aztec

      - uses: ./.github/actions/ppv2-fetch

      - uses: ./.github/actions/bridge-evm-build

      - name: Unit tests
        run: bun run --cwd packages/local-stack test

      - name: Integration suite
        # Twice each suite's measured step time, rounded up to whole minutes (at least 2): a slow
        # runner stays green and a hang fails well inside the job's ceiling. Setup and the pool fetch,
        # cold on every run of a pull request that changes its pin, fall outside it.
        # behavior-gating.test.ts requires an entry per suite file.
        timeout-minutes: ${{ fromJSON('{"bridge":4,"heartbeat":14,"imports":2,"shared-anvil":12,"teardown":13}')[matrix.suite] || 20 }}
        # A skipped or todo case is a gate that never ran, and the heartbeat's liveness case must pass by name.
        run: |
          start=$(date +%s)
          set +e
          bun run --cwd packages/local-stack test:integration "test/integration/$SUITE.integration.test.ts" \
            --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/integration.json" 2>&1 | tee integration.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$SUITE wall-clock: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$status" -eq 0 ] || exit "$status"
          jq -e --arg suite "$SUITE" '.success and .numFailedTests == 0 and .numPendingTests == 0 and .numTodoTests == 0
            and ([.testResults[] | select(.status == "passed") | .name | split("/") | last] == [$suite + ".integration.test.ts"])
            and ($suite != "heartbeat"
              or [.testResults[].assertionResults[] | select(.title | startswith("a lone Inbox message becomes consumable")) | .status] == ["passed"])' \
            integration.json

      - name: Upload stack logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-stack-logs-${{ matrix.suite }}
          path: |
            integration.log
            integration.json
            ~/.cache/pp/bridge-sandbox/logs/*.log
            ~/.cache/pp/asp-bot/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  bridge-stack:
    # bridge-core's stack suite against one stack this job boots and stops (scripts/with-stack.ts).
    name: bridge stack suite
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - uses: ./.github/actions/setup-aztec

      - uses: ./.github/actions/ppv2-fetch

      - uses: ./.github/actions/bridge-evm-build

      - name: Stack suite
        # Twice the measured step time (boot, cases, teardown), rounded up to whole minutes.
        timeout-minutes: 7
        working-directory: packages/bridge-core
        # A required case that was skipped, filtered or renamed fails check-cases.
        run: |
          start=$(date +%s)
          set +e
          bun run test:integration:stack -- deploy \
            --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/stack.json" 2>&1 | tee "$GITHUB_WORKSPACE/stack.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "bridge stack wall-clock: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$status" -eq 0 ] || exit "$status"
          bun scripts/check-cases.ts deploy "$GITHUB_WORKSPACE/stack.json"

      - name: Upload stack logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-stack-logs
          path: |
            stack.log
            stack.json
            ~/.cache/pp/bridge-sandbox/logs/*.log
            ~/.cache/pp/asp-bot/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  status:
    name: local-stack-status
    if: always()
    needs: [changes, stack, bridge-stack]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-cd/aggregate-status.sh
          sparse-checkout-cone-mode: false
      - name: Aggregate results
        run: |
          bash scripts/ci-cd/aggregate-status.sh "${{ needs.changes.result }}" "${{ needs.changes.outputs.stack }}" "${{ needs.stack.result }}"
          bash scripts/ci-cd/aggregate-status.sh "${{ needs.changes.result }}" "${{ needs.changes.outputs.stack }}" "${{ needs.bridge-stack.result }}"
