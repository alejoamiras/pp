name: Web

# PR gate for the web app (apps/web): typecheck, unit and component tests, the production build, its
# preview and server headers and the stack-build guard; then the browser suite, which boots the
# local stack, builds the app against its manifest and drives the built bundle through the e2e kit.
#
# NO `branches:` filter, deliberately: see pr-quick.yml.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: web-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.override.outputs.full || steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: paths-filter needs the merge-base with the comparison branch; a
          # shallow clone falls back to a `fetch --deepen` loop that races on long branches.
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          # Positive-only, no `!` negations (dorny's some-quantifier footgun). The app and the kit
          # whole; the sources of what they load (bridge-core with its sandbox harness in scripts/,
          # bridge-spec, pool-client, label-paths, run-isolation, and the local stack the suite boots
          # with pp-env and asp-bot); contracts/bridge/**, which the sandbox and the stack build and
          # deploy; the actions these jobs run; the root files the install and the vitest config
          # read (lint lives in pr-quick.yml). Pinned by scripts/ci-cd/behavior-gating.test.ts.
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/e2e-kit/**'
              - 'packages/bridge-core/src/**'
              - 'packages/bridge-core/scripts/**'
              - 'packages/bridge-core/package.json'
              - 'packages/bridge-spec/src/**'
              - 'packages/bridge-spec/package.json'
              - 'packages/bridge-spec/vectors/v1.json'
              - 'packages/pool-client/src/**'
              - 'packages/pool-client/package.json'
              - 'packages/pool-client/test/support/**'
              - 'packages/label-paths/src/**'
              - 'packages/label-paths/package.json'
              - 'packages/run-isolation/src/**'
              - 'packages/run-isolation/package.json'
              - 'packages/local-stack/src/**'
              - 'packages/local-stack/package.json'
              - 'packages/pp-env/**'
              - 'packages/asp-bot/src/**'
              - 'packages/asp-bot/package.json'
              - 'packages/labelled-token/src/**'
              - 'packages/labelled-token/package.json'
              - 'packages/labelled-token/test/net/testing.ts'
              - 'contracts/bridge/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'vitest.base.ts'
              - 'patches/**'
              - '.github/workflows/web.yml'
              - '.github/actions/setup-aztec/**'
              - '.github/actions/setup-bun/**'
              - '.github/actions/setup-playwright/**'
              - '.github/actions/ppv2-fetch/**'
              - '.github/actions/bridge-evm-build/**'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "full=true" >> "$GITHUB_OUTPUT"

  build:
    name: Typecheck, test, build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Typecheck
        run: bun run --cwd apps/web typecheck
      - name: Unit and component tests
        run: bun run --cwd apps/web test
      - name: Build
        run: bun run --cwd apps/web build
      - name: Server headers
        run: bun run --cwd apps/web test:headers
      - name: Stack build guard
        run: bun run --cwd apps/web check:stack-build

  e2e:
    name: Browser suite
    needs: [changes, build]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      # setup-aztec shells out to bun, so it has to be on PATH first. Its default version is
      # bridge-core's @aztec-labs/aztec.js pin, the line the local stack runs.
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-aztec

      # What the local stack boots from, as in local-stack.yml: the pool's checkout (whose circuits
      # the app's server also serves) and the bridge's L1 build. Both install Foundry 1.7.1 and the
      # forge libraries themselves.
      - uses: ./.github/actions/ppv2-fetch
      - uses: ./.github/actions/bridge-evm-build

      - uses: ./.github/actions/setup-playwright

      # The kit's runner in stack mode: ports, the local stack, the test-wallet build, the app's
      # build:local against the stack's manifest, Playwright, reap. Its state goes outside the
      # checkout, where the upload below finds it without hidden paths.
      - name: Browser suite
        env:
          PP_E2E_STATE_DIR: ${{ runner.temp }}/web-e2e
        run: bun run --cwd apps/web e2e

      - name: Upload the Playwright report and logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e
          path: |
            ${{ runner.temp }}/web-e2e/playwright-report
            ${{ runner.temp }}/web-e2e/test-results
            ${{ runner.temp }}/web-e2e/*.log
            ${{ runner.temp }}/web-e2e/stack.json
            ~/.cache/pp/bridge-sandbox/logs/*.log
            ~/.cache/pp/asp-bot/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  status:
    name: web-status
    if: always()
    needs: [changes, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-cd/aggregate-status.sh
          sparse-checkout-cone-mode: false
      - name: Aggregate results
        # The exact state machine lives in a script with its own truth-table test; it runs once per
        # gated job, so neither can be red or skipped under a green check.
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.web }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          fail=0
          bash scripts/ci-cd/aggregate-status.sh "$CHANGES" "$RUN" "$BUILD" || fail=1
          bash scripts/ci-cd/aggregate-status.sh "$CHANGES" "$RUN" "$E2E" || fail=1
          exit "$fail"
