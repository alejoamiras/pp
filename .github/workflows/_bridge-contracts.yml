name: _Bridge contracts (reusable)

# Runs the L1 (Foundry) and L2 (Noir) contract suites for contracts/bridge/** (every Noir gate
# from contracts/crates.json), the labelled token's gate budgets, and packages/bridge-core's
# integration suite: one anvil + `aztec start --local-network` per job, a generation deployed onto
# it, every round trip driven through the same seams the tools app calls.
#
# Nothing under contracts/ was gated before this workflow existed, so a build-breaking
# remap regression went unnoticed: the only signal was a local run on a machine that
# happened to still have a hoisted node_modules.
#
# The fork-gated Foundry suites need SEPOLIA_RPC_URL and live testnet state and stay manual.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  forge:
    name: forge build + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pinned, not `stable`: a newer Foundry routes test-contract creation through the
      # deployCode(string,bytes) cheatcode, which halmos 0.3.3 does not implement — setUp then
      # finds no successful path and every proof fails. This is the version the suites were
      # validated against. Bump it deliberately, re-running halmos when you do. 1.8.1 was tried
      # with halmos 0.3.3: 0 of 12 proofs pass, and the gas snapshot moves by 8%.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: "1.7.1"

      # lib/ is gitignored; the script pins each library to a commit.
      - name: Install forge libraries
        run: bash contracts/bridge/evm/scripts/install-libs.sh

      # foundry.toml's @aztec/ and @aztec-blob-lib/ remaps assume a hoisted node_modules;
      # this repo uses bun's isolated linker, so the generated remappings.txt is what makes
      # the project resolve at all.
      - name: Generate remappings
        run: bun packages/bridge-core/scripts/gen-remappings.ts

      - name: forge build
        working-directory: contracts/bridge/evm
        run: forge build

      - name: forge test (hermetic)
        working-directory: contracts/bridge/evm
        run: forge test --no-match-contract Fork

      # BridgeMessageV1Test must fail on a flipped vector in each section it reads, after a clean
      # control run against the same override path.
      - name: Wire-format vector mutation (Solidity)
        run: bun run --cwd packages/bridge-spec vectors:mutate -- --suite sol

      # The metered portal calls. A regression fails here rather than surfacing as a surprise on a
      # user's first deposit; regenerate deliberately with `forge snapshot --match-test test_gas_`
      # when the cost change is intended. The script also requires every metered case to have run.
      - name: gas snapshot
        run: bash contracts/bridge/evm/scripts/check-gas.sh

      - name: halmos symbolic proofs
        run: |
          pipx install "halmos==$(cat contracts/bridge/evm/halmos.version)"
          bash contracts/bridge/evm/scripts/check-halmos.sh

      # The hand-written ABI consts bridge-core ships to the browser are pinned against the forge
      # artifacts by vitest — which the unit-test job runs WITHOUT artifacts (it skips). This is the
      # one place both exist.
      - name: ABI pins (bridge-core ↔ forge artifacts)
        run: |
          # The pin suites skip when the artifacts are absent; here that would be a silent pass.
          test -f contracts/bridge/evm/out/PortalFactory.sol/PortalFactory.json
          test -f contracts/bridge/evm/out/TokenPortalImpl.sol/TokenPortalImpl.json
          bun run --cwd packages/bridge-core test -- factory-abi

  # contracts/crates.json decides which Noir gates run on which crate; a new crate is one entry there.
  # The matrices carry no `if:`: an empty one fails its job instead of skipping it green.
  crates:
    name: crate manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      aztec: ${{ steps.read.outputs.aztec }}
      parity: ${{ steps.read.outputs.parity }}
      txe: ${{ steps.read.outputs.txe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      # One toolchain for every crate: the reader refuses two different aztec-nr tags. Compiling a
      # tag's aztec-nr with another nargo dies inside upstream's macros.
      - name: Read contracts/crates.json
        id: read
        run: |
          aztec=$(bun scripts/ci-cd/crates.ts aztec-version)
          parity=$(bun scripts/ci-cd/crates.ts matrix parity)
          txe=$(bun scripts/ci-cd/crates.ts matrix txe)
          printf 'aztec=%s\nparity=%s\ntxe=%s\n' "$aztec" "$parity" "$txe" >> "$GITHUB_OUTPUT"

  noir:
    name: nargo test
    needs: crates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-aztec shells out to bun, so it has to be on PATH before that step runs.
      - uses: ./.github/actions/setup-bun

      - uses: ./.github/actions/setup-aztec
        with:
          version: ${{ needs.crates.outputs.aztec }}

      # Oracle-free tests only (a TXE suite has its own job). Each crate's run must reach its floor,
      # or pass its check script's by-name requirements: nargo exits 0 when a filter matches
      # nothing. --force because target/ is tracked: without it nargo can report a stale success
      # having compiled nothing.
      - name: nargo tests
        run: bun scripts/ci-cd/crates.ts nargo-test

      - name: Wire-format vector mutation (Noir)
        run: bun run --cwd packages/bridge-spec vectors:mutate -- --suite nr

      # Nargo has no lockfile, so a moved tag would change a build silently. Every tag the tests above
      # fetched must be pinned and sit at its recorded commit; each Noir job checks its own fetch.
      - name: pinned dependency commits
        run: |
          list="$(bun scripts/ci-cd/crates.ts list nargo)"
          mapfile -t crates <<< "$list"
          bun scripts/ci-cd/crates.ts check-pins "${crates[@]}"

  parity:
    name: artifact parity (${{ matrix.crate }})
    needs: crates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.crates.outputs.parity) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - uses: ./.github/actions/setup-aztec
        with:
          version: ${{ needs.crates.outputs.aztec }}

      # The committed artifacts are what every deploy and every claim binds to. Rebuilding one from
      # source with the pinned `aztec compile` and requiring the same class id (a program's hash)
      # and the same ABI is the only proof that the bytes in git are the bytes the source describes.
      # AZTEC_HOME is the toolchain this run installed, never a default.
      - name: compile.sh --check
        env:
          AZTEC_VERSION: ${{ needs.crates.outputs.aztec }}
          CRATE: ${{ matrix.crate }}
        run: AZTEC_HOME="$HOME/.aztec/versions/$AZTEC_VERSION" bash contracts/bridge/aztec/scripts/compile.sh --check "$CRATE"

      - name: pinned dependency commits
        env:
          CRATE: ${{ matrix.crate }}
        run: bun scripts/ci-cd/crates.ts check-pins "$CRATE"

  txe:
    name: TXE suite (${{ matrix.crate }})
    needs: crates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.crates.outputs.txe) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - uses: ./.github/actions/setup-aztec
        with:
          version: ${{ needs.crates.outputs.aztec }}

      # The runner rebuilds the crate, spins the oracle server itself (the committed txe-server
      # mini-project, frozen lockfile) and checks every name in txe-manifest.txt passed, so a dropped
      # `mod test;` or a silently skipped file cannot read as green.
      - name: run-txe-tests.sh
        env:
          AZTEC_VERSION: ${{ needs.crates.outputs.aztec }}
          CRATE: ${{ matrix.crate }}
        run: AZTEC_HOME="$HOME/.aztec/versions/$AZTEC_VERSION" bash contracts/bridge/aztec/scripts/run-txe-tests.sh --crate "$CRATE"

      - name: pinned dependency commits
        env:
          CRATE: ${{ matrix.crate }}
        # The suite also built every crate whose artifact it stages.
        run: |
          list="$(bun scripts/ci-cd/crates.ts get "$CRATE" txe.build)"
          mapfile -t crates <<< "$list"
          bun scripts/ci-cd/crates.ts check-pins "${crates[@]}"

  token-gates:
    name: labelled token gates
    # Parity fixes every private function's circuit, so profiling the committed artifact measures
    # the source; a hand-edited bench/gates.json fails here.
    needs: [crates, parity]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - uses: ./.github/actions/setup-aztec
        with:
          version: ${{ needs.crates.outputs.aztec }}

      - name: gates:check
        env:
          AZTEC_VERSION: ${{ needs.crates.outputs.aztec }}
        run: AZTEC_HOME="$HOME/.aztec/versions/$AZTEC_VERSION" bun run --cwd packages/labelled-token gates:check

      # The TXE suite's trees are rendered from @pp/bridge-spec; a hand-edited or stale paths.nr fails here.
      - name: fixtures:check
        run: bun run --cwd packages/labelled-token fixtures:check

  integration:
    name: sandbox integration (anvil + local network)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      # The sandbox runs on bridge-core's @aztec line, NOT the hub crate's older Nargo pin: the two
      # jobs above compile Noir at the tag the crate names; this one runs the node the TS talks to.
      - name: Resolve bridge-core's Aztec pin
        id: aztec-pin
        run: |
          VERSION=$(bun -e "const v=JSON.parse(require('fs').readFileSync('packages/bridge-core/package.json','utf8')).dependencies['@aztec-labs/aztec.js']; if(!v) throw new Error('bridge-core pins no @aztec-labs/aztec.js'); console.log(v)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-aztec
        with:
          version: ${{ steps.aztec-pin.outputs.version }}

      # Same pins as the forge job: the generation deploys from these artifacts.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: "1.7.1"

      - name: Install forge libraries
        run: bash contracts/bridge/evm/scripts/install-libs.sh

      - name: Generate remappings + forge build
        run: |
          bun packages/bridge-core/scripts/gen-remappings.ts
          forge build --root contracts/bridge/evm

      - name: Integration suite
        run: bun run --cwd packages/bridge-core test:integration

      - name: Upload sandbox logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-integration-logs
          path: |
            /tmp/bridge-integration-*
            ~/.cache/pp/bridge-sandbox/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  registry-network:
    name: ASP registry on a local network
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      # Defaults to bridge-core's @aztec-labs pin, the node the suite talks to.
      - uses: ./.github/actions/setup-aztec

      # No forge build: the suite deploys only the committed registry and probe artifacts on L2.
      - name: Registry network suite
        run: bun run --cwd packages/bridge-core test:registry

      - name: Upload sandbox logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asp-registry-network-logs
          path: ~/.cache/pp/bridge-sandbox/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  sole-consumer:
    name: sole-consumer static guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Guards the F-007 invariant that claim_private is the only consumer of a mint_to_private
      # message. It was never wired to anything. --self-test first: it replays crafted
      # bearer regressions, so a guard whose own parser has broken fails here rather than
      # reporting a clean scan of a file it can no longer read.
      - name: check-sole-consumer (self-test)
        run: bash contracts/bridge/aztec/scripts/check-sole-consumer.sh --self-test

      - name: check-sole-consumer
        run: bash contracts/bridge/aztec/scripts/check-sole-consumer.sh
