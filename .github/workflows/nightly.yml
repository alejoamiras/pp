name: Nightly

# Suites too slow for a pull request: `bun run nightly`, as defined by the branch under test. A
# scheduled workflow runs only from the default branch while lanes merge into bridge-v1, so this one
# checks out bridge-v1 when it exists, else main. That puts integration-branch code in main's cache
# scope, so the job may only read caches (`cache-mode`, which binds any code the job runs, not just
# the cache actions), every cache action is restore-only, the toolchain actions come from this
# workflow's own commit, and no secret is used.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to test; empty means bridge-v1 when it exists, else main
        required: false
        default: ""
      suites:
        description: Suite names to run, separated by spaces; empty runs every suite
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly-${{ inputs.ref || 'default' }}
  cancel-in-progress: false

jobs:
  nightly:
    name: nightly suites
    runs-on: ubuntu-latest
    # The nightly step's own timeout plus the setup before it and the upload after it.
    timeout-minutes: 140
    cache-mode: read
    steps:
      - name: Resolve the ref under test
        id: ref
        env:
          WANTED: ${{ inputs.ref }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        # A ref pattern matches any ref ending in it (`feature/bridge-v1`, a tag of the same name), so
        # the listed names are compared exactly; a listing that fails fails the job rather than reading
        # as "absent".
        run: |
          if [ -n "$WANTED" ]; then
            ref="$WANTED"
          else
            listed="$(git ls-remote "$REPO_URL" refs/heads/bridge-v1)"
            if printf '%s\n' "$listed" | cut -f2 | grep -qx refs/heads/bridge-v1; then
              ref=refs/heads/bridge-v1
            else
              ref=refs/heads/main
            fi
          fi
          echo "testing $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.ref.outputs.ref }}

      # GitHub lists the run under the workflow's own branch and commit, not the one it tested.
      - name: Name the tested commit
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: echo "Tested \`$REF\` at \`$(git rev-parse HEAD)\`, with the workflow from \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"

      # After the tested checkout, which would clean anything already in the workspace.
      - name: Check out this workflow's toolchain actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .nightly-ci
          sparse-checkout: .github/actions

      - uses: ./.nightly-ci/.github/actions/setup-bun
        with:
          cache-save: "false"

      # The real-wallet tier loads the wallet's release build in Playwright's bundled Chromium.
      - uses: ./.nightly-ci/.github/actions/setup-playwright
        with:
          cache-save: "false"

      - uses: ./.nightly-ci/.github/actions/setup-aztec
        with:
          cache-save: "false"

      # Pinned for the same reason as the pull-request job: newer Foundry breaks halmos 0.3.3, and the
      # suites were validated on this version.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: "1.7.1"
          cache: false

      # The local-stack suite boots the pool on its anvil.
      - uses: ./.nightly-ci/.github/actions/ppv2-fetch
        with:
          cache-save: "false"

      # Suite names come in through the environment and leave as arguments: only lowercase letters,
      # digits, dashes and spaces pass (a newline would hide the names after it from `read`), no name
      # starts with a dash (it would read as an option), and the script refuses an unknown name. The real-wallet tier makes a directory of its own under
      # PP_E2E_STATE_DIR for each run. The step's timeout leaves the job time to upload after a hang.
      - name: bun run nightly
        timeout-minutes: 115
        env:
          SUITES: ${{ inputs.suites }}
          PP_E2E_STATE_DIR: ${{ runner.temp }}/nightly-e2e
        run: |
          plain='^[a-z0-9 -]*$'
          name='^[a-z0-9][a-z0-9-]*$'
          if [[ ! $SUITES =~ $plain ]]; then
            echo "suites: names are lowercase letters, digits and dashes, separated by spaces" >&2
            exit 1
          fi
          read -ra names <<< "$SUITES"
          for n in "${names[@]}"; do
            if [[ ! $n =~ $name ]]; then
              echo "suites: '$n' starts with a dash" >&2
              exit 1
            fi
          done
          bun run nightly "${names[@]}"

      # The uploader follows symlinks, and a link could lead it into the wallet profile. Each
      # `real-wallet-*` is a directory run.ts made, so a link in its place goes too. If this step
      # fails, nothing is uploaded.
      - name: Drop symlinks from the real-wallet reports
        id: drop
        if: failure()
        env:
          STATE: ${{ runner.temp }}/nightly-e2e
        run: |
          shopt -s nullglob
          for run in "$STATE"/real-wallet-*; do
            if [ -L "$run" ]; then rm -v -- "$run"; continue; fi
            for p in test-results playwright-report sandbox.log stack.log build-wallet.log build-app.log; do
              if [ -e "$run/$p" ] || [ -L "$run/$p" ]; then find "$run/$p" -type l -print -delete; fi
            done
          done

      # A trace of a wallet window can show that run's password or recovery phrase, worthless outside
      # the run, so the artifact is short-lived. Never the wallet profile (`real-wallet-*/real-wallet`).
      - name: Upload the real-wallet reports and logs on failure
        if: failure() && steps.drop.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-real-wallet
          path: |
            ${{ runner.temp }}/nightly-e2e/real-wallet-*/test-results/
            ${{ runner.temp }}/nightly-e2e/real-wallet-*/playwright-report/
            ${{ runner.temp }}/nightly-e2e/real-wallet-*/sandbox.log
            ${{ runner.temp }}/nightly-e2e/real-wallet-*/stack.log
            ${{ runner.temp }}/nightly-e2e/real-wallet-*/build-wallet.log
            ${{ runner.temp }}/nightly-e2e/real-wallet-*/build-app.log
            !${{ runner.temp }}/nightly-e2e/real-wallet-*/real-wallet/**
          if-no-files-found: ignore
          retention-days: 3
