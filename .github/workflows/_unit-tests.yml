name: _Unit tests (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  unit-tests:
    name: Vitest + bun test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      # run-isolation's unit tests load its entries in native Node, which strips types from 22.18 on.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Unit tests in every workspace
        run: bun run test:all

      # The committed vectors and the keystone's generated Noir must equal a fresh generation, and
      # the TS parity suite must fail on a flipped vector in every section.
      - name: Wire-format vectors are current
        run: bun run --cwd packages/bridge-spec vectors:check

      - name: Wire-format vector mutation (TS)
        run: bun run --cwd packages/bridge-spec vectors:mutate -- --suite ts

      # scripts/ci-cd/ is not a workspace, so `test:all` skips it. It holds the guards that pin
      # these workflows' filters and aggregators; without this step they would never run on a PR.
      - name: CI-gating tests
        run: bun run test:ci-gating
