name: Setup Playwright
description: Restore the Playwright browser cache keyed on the Playwright version a workspace installed, then install Chromium with its system deps.

inputs:
  package-dir:
    description: The workspace whose installed Playwright keys the cache and installs Chromium, relative to the repository root.
    default: packages/e2e-kit
  cache-save:
    description: >
      "false" never saves the browser cache, for a job that runs code from a branch other than the
      one whose cache scope it writes to.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # The installed version, not the manifest: a `catalog:` spec stays the same when the catalog
    # moves Playwright to a release with new browsers.
    - name: Read the installed Playwright version
      id: version
      shell: bash
      env:
        PLAYWRIGHT: ${{ inputs.package-dir }}/node_modules/.bin/playwright
      run: |
        out=$("$PLAYWRIGHT" --version)
        if [[ ! $out =~ ^Version\ ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$ ]]; then
          echo "setup-playwright: unexpected version output: $out" >&2
          exit 1
        fi
        echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
    - name: Restore the browser cache
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.version.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-playwright-
    # The browser download is skipped on a cache hit; the OS deps are installed either way (they
    # live outside the cache).
    - name: Install Chromium
      shell: bash
      env:
        PLAYWRIGHT: ${{ inputs.package-dir }}/node_modules/.bin/playwright
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
      run: |
        if [ "$CACHE_HIT" = "true" ]; then
          "$PLAYWRIGHT" install-deps chromium
        else
          "$PLAYWRIGHT" install --with-deps chromium
        fi
    # Never from a pull request: each saved its own copy of the browsers, readable only by that pull
    # request, and those copies pushed main's caches out under the repository's cache limit. Pull
    # requests restore what a run in main's scope saved, or download.
    - name: Save the browser cache
      if: >-
        steps.restore.outputs.cache-hit != 'true' && github.event_name != 'pull_request' &&
        inputs.cache-save != 'false'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.restore.outputs.cache-primary-key }}
