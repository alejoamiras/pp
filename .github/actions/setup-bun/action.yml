name: Setup Bun
description: |
  Install Bun, restore the install cache, and run `bun install --frozen-lockfile`.
  Callers must `actions/checkout@v7` before invoking this action — it does NOT
  check out the repo itself: every caller already has, and a second checkout
  is pure overhead.

  Bun version is pinned (matches `packageManager` in root package.json).
  Cache key includes the Bun version so a Bun bump invalidates stale state.

inputs:
  cache-save:
    description: >
      "false" restores the install cache without saving it, for a job that runs code from a branch
      other than the one whose cache scope it writes to.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
        # Its executable cache saves too; restore-only callers download Bun instead.
        no-cache: ${{ inputs.cache-save == 'false' }}

    - if: inputs.cache-save != 'false'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-1.4.2-
          ${{ runner.os }}-bun-

    - if: inputs.cache-save == 'false'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-1.4.2-
          ${{ runner.os }}-bun-

    - shell: bash
      run: bun install --frozen-lockfile
